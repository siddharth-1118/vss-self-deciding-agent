# VSS-Small: ~50-100M params target.
model:
  hidden_size: 512
  layers: 10
  heads: 8
  kv_heads: 4          # grouped-query attention
  intermediate_size: 2048
  max_sequence_length: 4096
  dropout: 0.0
  vocab_size: 24576
  hash_buckets: 16384
  score_bins: 64
  rope_theta: 10000.0
  pad_token_id: 0

inference:
  abstain_threshold: 0.55
  enable_abstention: true
  confidence_mode: blend
  deterministic: true

training:
  seed: 13
  batch_size: 32
  lr: 2.5e-4
  weight_decay: 0.01
  warmup_steps: 400
  epochs: 3
  clip_grad_norm: 1.0
  precision: bf16
  scheduler: cosine
  loss_weights:
    choice: 1.0
    noul: 1.0
    score: 1.0
  score_ordinal_weight: 0.25
  log_every: 50
  eval_every: 300
  checkpoint_dir: runs/small
